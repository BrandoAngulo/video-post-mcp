[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-post-mcp"
version = "0.1.0"
description = "Servidor MCP local de postproducción de reels con FFmpeg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-post-mcp = "video_post_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
